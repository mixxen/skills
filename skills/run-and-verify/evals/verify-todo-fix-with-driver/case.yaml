schema_version: "1.1"
name: verify-todo-fix-with-driver
expected_outcome: |
  Starts the server in the background and uses scripts/drive.mjs to add several todos and
  complete one, confirming only that one is done. Checks nearby features from the feature
  map and an edge case: completing the same todo twice marks it not done again (the
  handler toggles), and the Remaining count is wrong after completing twice or after Clear
  completed, because doneCount only ever goes up. Quotes driver output, reports both
  problems with file and line and a proposed fix, does not edit server.mjs because the
  user asked only for a check, stops the server, and does not report the app as fully
  working.
context:
  scaffold_script: place-files.sh
